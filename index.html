<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Express - Đặt Món Ăn</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">🍔</span>
      <span class="logo-text">Food<strong>Express</strong></span>
    </div>
    <div class="cart-btn" id="openCartBtn">
      <span>🛒 Giỏ hàng</span>
      <span class="cart-badge" id="cartCount">0</span>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Hôm nay bạn muốn ăn gì?</h1>
    <p>Món ngon giao tận nơi, nhanh chóng và nóng hổi!</p>
  </section>

  <!-- Filter Buttons -->
  <div class="categories">
    <button class="cat-btn active" data-category="all">Tất cả</button>
    <button class="cat-btn" data-category="main">Món chính</button>
    <button class="cat-btn" data-category="fastfood">Ăn vặt / Fast food</button>
    <button class="cat-btn" data-category="drink">Đồ uống</button>
  </div>

  <!-- Food Grid -->
  <main class="container">
    <div class="food-grid" id="foodGrid"></div>
  </main>

  <!-- Cart Sidebar -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h2>Giỏ Hàng Của Bạn</h2>
      <button class="close-btn" id="closeCartBtn">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
      <p class="empty-cart-msg">Giỏ hàng đang trống</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Tổng cộng:</span>
        <span id="cartTotal">0 đ</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn" disabled>Đặt Hàng Ngay</button>
    </div>
  </aside>

  <!-- Success Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <h3>Đặt hàng thành công!</h3>
      <p id="orderSummary"></p>
      <button class="close-modal-btn" id="closeModalBtn">Tiếp tục mua hàng</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
